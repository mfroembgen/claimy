{{- if .Values.migrations.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "claimy-chart.migrationConfigName" . }}
  labels:
    {{- include "claimy-chart.labels" . | nindent 4 }}
  annotations:
    {{- $defaults := dict
      "helm.sh/hook" "pre-install,pre-upgrade"
      "helm.sh/hook-weight" "-10"
      "helm.sh/hook-delete-policy" "before-hook-creation"
    }}
    {{- mergeOverwrite $defaults (default (dict) .Values.migrations.configMapAnnotations) | toYaml | nindent 4 }}
data:
  config.dist.yml: |
    {{- include "claimy-chart.config" . | nindent 4 }}
{{- end }}
